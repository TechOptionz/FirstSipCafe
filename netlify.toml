# Netlify serves everything under public/ straight from its CDN, so the
# `headers()` in next.config.mjs never reaches those files: without this they go
# out as `Cache-Control: max-age=0, must-revalidate` and the browser re-requests
# every photo on every page view. Photos are only ever added under a new file
# name (re-running scripts/optimize-images.mjs on a changed source needs a new
# name too), so they can be cached for a year.

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
